name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run lint

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/database lint
      - run: bun run --cwd packages/database typecheck
      - run: bunx drizzle-kit check --config drizzle.config.ts
        working-directory: packages/database
        env:
          DATABASE_URL: postgres://fitpal:fitpal@localhost:5432/fitpal

  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fitpal
          POSTGRES_PASSWORD: fitpal
          POSTGRES_DB: fitpal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitpal -d fitpal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://fitpal:fitpal@localhost:5432/fitpal_test
      REDIS_URL: redis://localhost:6379
      OTP_PEPPER: test-only-otp-pepper-at-least-32-characters-long
      SMS_MODE: mock
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Apply migrations to fitpal_test
        run: bun run --cwd packages/database migrate
        env:
          DATABASE_URL: postgres://fitpal:fitpal@localhost:5432/fitpal_test
      - run: bun run --cwd apps/api test

  container:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://fitpal:fitpal@localhost:5432/fitpal
      REDIS_URL: redis://localhost:6379
      CORS_ORIGIN: https://app.example.com
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_REDIRECT_URI: https://api.example.com/api/v1/auth/google/callback
      CLIENT_URL: https://app.example.com
      MOBILE_OAUTH_SCHEMES: fitpal
      OTP_PEPPER: ci-only-otp-pepper-at-least-32-characters
      EMAIL_PROVIDER: gmail
      SMTP_HOST: smtp.example.com
      SMTP_USER: ci-user@example.com
      SMTP_PASSWORD: ci-placeholder
      EMAIL_FROM: FitPal <no-reply@example.com>
      REPLY_TO: FitPal <no-reply@example.com>
      SMS_MODE: disabled
      POSTGRES_USER: fitpal
      POSTGRES_PASSWORD: fitpal
      POSTGRES_DB: fitpal
      NEXT_PUBLIC_API_URL: http://localhost:3011
    steps:
      - uses: actions/checkout@v4
      - name: Create CI env file
        run: cp .env.example .env
      - run: docker compose -f docker/docker-compose.yml config -q
      - run: docker compose -f docker/docker-compose.prod.yml config -q
      - name: Build API production image
        run: docker build --target production -f docker/Dockerfile.api -t fitpal-api:ci .
      - name: Build web production image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:3011 -f docker/Dockerfile.web -t fitpal-web:ci .
