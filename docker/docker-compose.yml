services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fitpal
      POSTGRES_PASSWORD: fitpal
      POSTGRES_DB: fitpal
    ports:
      # Host 5433 to avoid clashing with the native Homebrew postgres on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitpal -d fitpal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Host 6380 to avoid clashing with other projects' Redis on 6379
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: migrate
    command: sh -c "cd packages/database && bun run migrate"
    environment:
      DATABASE_URL: postgres://fitpal:fitpal@postgres:5432/fitpal
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "3001:3001"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://fitpal:fitpal@postgres:5432/fitpal
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
